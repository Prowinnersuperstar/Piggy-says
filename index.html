<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piggy Says</title>
<style>
:root {
    --primary: #8B00FF;
    --accent: #FF00AA;
    --bg: #0f0f0f;
    --sidebar-width: 260px;
}

/* Reset styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: white;
    min-height: 100vh;
}

/* Sidebar for desktop only */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: var(--sidebar-width);
    background: #1a1a1a;
    padding: 30px 20px;
    border-right: 1px solid #333;
    z-index: 1001;
    display: block; /* visible on desktop */
    overflow-y: auto;
}

/* Hide sidebar on mobile */
@media(max-width: 767px) {
  .sidebar {
    display: none;
  }
}

/* Header aligned with sidebar on desktop */
header {
    margin-left: var(--sidebar-width);
    background: linear-gradient(135deg, var(--primary), #6a00cc);
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(139, 0, 255, 0.3);
}

/* Header logo container */
.header-logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 5px;
}
.header .logo-img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid white;
    margin-right: 10px;
}
h1 {
    font-size: 2.2rem;
    font-weight: bold;
}
.subtitle {
    color: #ffccff;
    font-size: 1.1rem;
}

/* Main content */
main {
    margin-left: var(--sidebar-width);
    padding: 20px;
    padding-bottom: 80px;
}

/* Remove left margin on mobile (since sidebar is hidden) */
@media(max-width: 767px) {
  main {
    margin-left: 0;
  }
}

/* Sections */
.section {
    display: none;
    max-width: 800px;
    margin: 0 auto;
}
.section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Placeholder styles */
.empty-placeholder {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 1.1rem;
    border: 2px dashed #444;
    border-radius: 16px;
    margin: 20px 0;
}

/* YouTube container styles */
.video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    max-width: 100%;
    background: #000;
    border-radius: 16px;
    border: 3px solid var(--accent);
    margin: 20px 0;
}
.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

/* Subscribe button style */
.yt-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #FF0000;
    color: white;
    padding: 16px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.2rem;
    margin: 20px 0;
    transition: all 0.3s ease;
}
.yt-btn:hover {
    transform: scale(1.08);
    background: #cc0000;
}

/* Bottom nav for mobile only */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15, 15, 15, 0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 12px;
    z-index: 1000;
}

/* Show bottom nav only on mobile */
@media(min-width: 768px) {
  .bottom-nav {
    display: none;
  }
}

/* Show sidebar only on desktop */
@media(max-width: 767px) {
  .sidebar {
    display: none;
  }
  main {
    margin-left: 0;
  }
}
</style>
</head>
<body>

<!-- Sidebar for desktop -->
<nav class="sidebar">
  <div class="logo-container" style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
    <img src="https://plain-apac-prod-public.komododecks.com/202605/04/pNxPzHWuSkiTSfjvCfpz/image.png" 
         alt="Piggy Says Logo" 
         class="logo-img">
    <h2 style="margin-top:10px;">Piggy Says</h2>
  </div>
  <div class="sidebar-nav-item active" data-tab="home"><span>🏠</span> Home</div>
  <div class="sidebar-nav-item" data-tab="events"><span>🎉</span> Events</div>
  <div class="sidebar-nav-item" data-tab="youtube"><span>📺</span> YouTube</div>
</nav>

<!-- Header -->
<header>
  <div class="header-logo-container">
    <img src="https://plain-apac-prod-public.komododecks.com/202605/04/pNxPzHWuSkiTSfjvCfpz/image.png" 
         alt="Piggy Says Logo" 
         class="logo-img">
    <h1>Piggy Says</h1>
  </div>
  <p class="subtitle">Welcome to the sub!</p>
</header>

<!-- Main Content -->
<main>
  <section id="home" class="section active">
    <h2>Welcome to Piggy Says! 🐷</h2>
    <div class="empty-placeholder">Main content coming soon...</div>
  </section>
  <section id="events" class="section">
    <h2>Upcoming Events 🎉</h2>
    <div class="empty-placeholder">Event schedule coming soon!</div>
  </section>
  <section id="youtube" class="section" style="text-align: center;">
    <h2>Watch Piggy on YouTube</h2>
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/3Zb3smwT-dk" frameborder="0" allowfullscreen></iframe>
    </div>
    <a href="https://youtube.com/@PagPagsays" class="yt-btn" target="_blank" id="subscribeBtn">
      ▶️ Subscribe to @PagPagsays
    </a>
  </section>
</main>

<!-- Bottom nav for mobile only -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="home"><span>🏠</span> Home</div>
  <div class="nav-item" data-tab="events"><span>🎉</span> Events</div>
  <div class="nav-item" data-tab="youtube"><span>📺</span> YouTube</div>
</div>

<script>
  // Desktop sidebar tab switch
  const sidebarItems = document.querySelectorAll('.sidebar .sidebar-nav-item');
  const sections = document.querySelectorAll('.section');

  sidebarItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.getAttribute('data-tab');
      sidebarItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      sections.forEach(sec => {
        sec.classList.toggle('active', sec.id === target);
      });
    });
  });

  // Mobile bottom nav switch
  const bottomItems = document.querySelectorAll('.bottom-nav .nav-item');
  bottomItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.getAttribute('data-tab');
      bottomItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      // also update sidebar active if visible
      document.querySelectorAll('.sidebar .sidebar-nav-item').forEach(i => {
        i.classList.toggle('active', i.getAttribute('data-tab') === target);
      });
      sections.forEach(sec => {
        sec.classList.toggle('active', sec.id === target);
      });
    });
  });

  document.getElementById('subscribeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.open('https://youtube.com/@PagPagsays', '_blank');
  });
</script>

</body>
</html>
