<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piggy Says</title>
<style>
/* Your existing styles, with added media queries for responsiveness */
:root {
    --primary: #8B00FF;
    --accent: #FF00AA;
    --bg: #0f0f0f;
    --sidebar-width: 260px;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: white;
    min-height: 100vh;
}
/* Header styles */
header {
    background: linear-gradient(135deg, var(--primary), #6a00cc);
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(139, 0, 255, 0.3);
}
.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 5px;
}
.logo-img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid white;
    object-fit: cover;
}
h1 {
    font-size: 2.2rem;
    font-weight: bold;
}
.subtitle {
    color: #ffccff;
    font-size: 1.1rem;
}
.sidebar {
    /* fixed on desktop only */
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: var(--sidebar-width);
    background: #1a1a1a;
    padding: 30px 20px;
    border-right: 1px solid #333;
    z-index: 1001;
    display: block; /* toggle with media queries */
    overflow-y: auto;
}
.sidebar h2 {
    margin-bottom: 30px;
    text-align: center;
    color: var(--accent);
}
.sidebar .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.sidebar .logo-container img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid white;
}
.sidebar .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    color: #aaa;
    text-decoration: none;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
}
.sidebar .sidebar-nav-item:hover {
    background: #252525;
    color: white;
}
.sidebar .sidebar-nav-item.active {
    background: var(--primary);
    color: white;
}
main {
    padding: 20px;
    padding-left: var(--sidebar-width);
}
@media(max-width: 767px) {
    /* hide sidebar on mobile */
    .sidebar {
        display: none;
    }
    main {
        padding-left: 0;
    }
}
/* Bottom nav for mobile only */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15, 15, 15, 0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 12px;
    z-index: 1000;
}
/* hide bottom nav on desktop */
@media(min-width: 768px) {
    .bottom-nav {
        display: none;
    }
}
.section {
    display: none;
    max-width: 800px;
    margin: 0 auto;
}
.section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- Sidebar (desktop only) -->
<nav class="sidebar">
  <div class="logo-container">
    <img src="https://plain-apac-prod-public.komododecks.com/202605/04/pNxPzHWuSkiTSfjvCfpz/image.png" 
         alt="Piggy Says Logo" class="logo-img" />
    <h2 style="margin-top:10px;">Piggy Says</h2>
  </div>
  <div class="sidebar-nav-item active" data-tab="home"><span>🏠</span> Home</div>
  <div class="sidebar-nav-item" data-tab="events"><span>🎉</span> Events</div>
  <div class="sidebar-nav-item" data-tab="youtube"><span>📺</span> YouTube</div>
</nav>

<!-- Header -->
<header>
  <div class="header-logo-container">
    <img src="https://plain-apac-prod-public.komododecks.com/202605/04/pNxPzHWuSkiTSfjvCfpz/image.png" 
         alt="Piggy Says Logo" class="logo-img" />
    <h1>Piggy Says</h1>
  </div>
  <p class="subtitle">Welcome to the sub!</p>
</header>

<!-- Main Content -->
<main>
  <section id="home" class="section active">
    <h2>Welcome to Piggy Says! 🐷</h2>
    <div class="empty-placeholder">Main content coming soon...</div>
  </section>
  <section id="events" class="section">
    <h2>Upcoming Events 🎉</h2>
    <div class="empty-placeholder">Event schedule coming soon!</div>
  </section>
  <section id="youtube" class="section" style="text-align: center;">
    <h2>Watch Piggy on Streamable</h2>
    <div class="video-container">
      <iframe src="https://streamable.com/e/erlwfl" frameborder="0" allowfullscreen></iframe>
    </div>
    <a href="https://youtube.com/@PagPagsays" class="yt-btn" target="_blank" id="subscribeBtn">
      ▶️ Subscribe to @PagPagsays
    </a>
  </section>
</main>

<!-- Bottom nav for mobile only -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="home"><span>🏠</span> Home</div>
  <div class="nav-item" data-tab="events"><span>🎉</span> Events</div>
  <div class="nav-item" data-tab="youtube"><span>📺</span> YouTube</div>
</div>

<script>
  // Desktop sidebar tab switch
  const sidebarItems = document.querySelectorAll('.sidebar .sidebar-nav-item');
  const sections = document.querySelectorAll('.section');

  sidebarItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.getAttribute('data-tab');
      sidebarItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      sections.forEach(sec => {
        sec.classList.toggle('active', sec.id === target);
      });
    });
  });

  // Mobile bottom nav switch
  const bottomItems = document.querySelectorAll('.bottom-nav .nav-item');
  bottomItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.getAttribute('data-tab');
      bottomItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      // update sidebar active if visible
      document.querySelectorAll('.sidebar .sidebar-nav-item').forEach(i => {
        i.classList.toggle('active', i.getAttribute('data-tab') === target);
      });
      sections.forEach(sec => {
        sec.classList.toggle('active', sec.id === target);
      });
    });
  });

  document.getElementById('subscribeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.open('https://youtube.com/@PagPagsays', '_blank');
  });
</script>

</body>
</html>
